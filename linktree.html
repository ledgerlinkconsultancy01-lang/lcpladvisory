<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LCPL Advisory - Links</title>
<style>
  :root {
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: #ffffff;
    display: flex;
    justify-content: center;
  }
  .wrap {
    position: relative;
    width: 100%;
    max-width: 560px;
    margin: 0 auto;
    line-height: 0;
  }
  .wrap img {
    display: block;
    width: 100%;
    height: auto;
    user-select: none;
    -webkit-user-drag: none;
  }
  .hotspot {
    position: absolute;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    display: block;
    /* uncomment the line below while positioning to see the clickable zones */
    /* outline: 2px dashed red; */
  }
  .hotspot:focus-visible {
    outline: 3px solid #2563eb;
    outline-offset: 2px;
  }
  @media (hover: hover) {
    .hotspot:hover {
      box-shadow: 0 0 0 4px rgba(0,0,0,0.06);
    }
  }
</style>
</head>
<body>

<div class="wrap">
  <img src="https://res.cloudinary.com/vwdrbdrg/image/upload/v1790429835/Linking_Image-01_jorxgx.jpg" alt="LCPL Advisory contact links">

  <!-- Website (globe icon) -->
  <a class="hotspot" href="https://www.lcpladvisory.com/" target="_blank" rel="noopener"
     style="left:86.06%; top:19.99%; width:19%; aspect-ratio:1/1;"
     aria-label="Website"></a>

  <!-- WhatsApp icon -->
  <a class="hotspot" href="https://wa.me/918238839433" target="_blank" rel="noopener"
     style="left:50.33%; top:28.36%; width:19%; aspect-ratio:1/1;"
     aria-label="WhatsApp"></a>

  <!-- LinkedIn icon -->
  <a class="hotspot" href="https://www.linkedin.com/company/lcpladvisory/posts/?feedView=all" target="_blank" rel="noopener"
     style="left:35.7%; top:48.47%; width:19%; aspect-ratio:1/1;"
     aria-label="LinkedIn"></a>

  <!-- Google Maps pin icon -->
  <a class="hotspot" href="https://maps.google.com/maps?ll=23.012175,72.602987&z=17&t=m&hl=en-US&gl=US&mapclient=embed&q=Sumel%20Business%20Park%202%20Ahmedabad" target="_blank" rel="noopener"
     style="left:50.33%; top:68.5%; width:19%; aspect-ratio:1/1;"
     aria-label="Google Maps location"></a>

  <!-- Instagram icon -->
  <a class="hotspot" href="https://www.instagram.com/thesonicmedia?stkn=d3F1YjQ4NHpiMDlx" target="_blank" rel="noopener"
     style="left:86.06%; top:76.81%; width:19%; aspect-ratio:1/1;"
     aria-label="Instagram"></a>

</div>

</body>
</html>
